[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cvcap"
version = "2.0.0"
description = "Capacidad, eficiencia coulómbica y retención a partir de voltametrías cíclicas exportadas de NOVA (Metrohm Autolab)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "pandas>=2.0", "openpyxl>=3.1", "scipy>=1.10"]

[project.optional-dependencies]
app = ["streamlit>=1.40,<1.50", "plotly>=5.18,<6.0", "xlrd>=2.0.1"]
dev = ["pytest>=7"]

[project.scripts]
cvcap = "cvcap.cli:main"

[tool.setuptools]
packages = ["cvcap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
